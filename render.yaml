services:
  - type: web
    name: urlly
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npx prisma generate && npx prisma migrate deploy && npm --prefix server run build && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYTICS_HASH_SECRET
        generateValue: true
